<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f1a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>MaBn AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2300d4ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'%3EM%3C/text%3E%3C/svg%3E" />

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #7c5cff;
  --accent2: #00d4ff;
  --text: #eef1ff;
  --glass: rgba(255, 255, 255, 0.08);
  --border: rgba(255, 255, 255, 0.12);
}

html, body {
  height: 100%;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  background: #0b0f1a;
  overflow: hidden;
}

#bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.app {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 800px;
  margin: 0 auto;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  background: var(--glass);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.5px;
}

.logo {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow: 0 0 18px rgba(124, 92, 255, 0.6);
}

.actions { display: flex; gap: 8px; }

button {
  font: inherit;
  color: var(--text);
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 12px;
  cursor: pointer;
  transition: transform 0.15s, background 0.2s, opacity 0.2s;
}
button:active { transform: scale(0.94); }

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}

.welcome {
  margin: auto;
  text-align: center;
  opacity: 0.9;
  padding: 20px;
}
.welcome h1 {
  font-size: 24px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 8px;
}
.welcome p { opacity: 0.7; }

.msg {
  max-width: 82%;
  padding: 12px 15px;
  border-radius: 18px;
  line-height: 1.5;
  font-size: 15px;
  word-wrap: break-word;
  animation: pop 0.3s ease;
}
.msg.user {
  align-self: flex-end;
  background: linear-gradient(135deg, var(--accent), #5b8cff);
  border-bottom-right-radius: 4px;
}
.msg.bot {
  align-self: flex-start;
  background: var(--glass);
  border: 1px solid var(--border);
  backdrop-filter: blur(10px);
  border-bottom-left-radius: 4px;
}
.msg.error { border-color: #ff5c7a; color: #ffb3c1; }
.msg code {
  background: rgba(0, 0, 0, 0.35);
  padding: 2px 6px;
  border-radius: 6px;
  font-family: monospace;
}

.typing span {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin: 0 2px;
  border-radius: 50%;
  background: var(--accent2);
  animation: blink 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

.inputbar {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 12px 14px 16px;
  background: var(--glass);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
}

.inputbar input {
  flex: 1;
  min-width: 0;
  padding: 13px 16px;
  border-radius: 24px;
  border: 1px solid var(--border);
  background: rgba(0, 0, 0, 0.3);
  color: var(--text);
  font-size: 16px;
  outline: none;
}
.inputbar input:focus { border-color: var(--accent2); }

.round {
  width: 48px;
  height: 48px;
  padding: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 18px;
  flex-shrink: 0;
}
.send {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
}
.mic.listening {
  background: #ff4d6d;
  animation: pulse 1.2s infinite;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: grid;
  place-items: center;
  z-index: 10;
  padding: 20px;
}
.modal.hidden { display: none; }
.card {
  width: 100%;
  max-width: 380px;
  background: #151b2e;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
}
.card h3 { margin-bottom: 8px; }
.card input {
  width: 100%;
  margin: 12px 0;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: rgba(0, 0, 0, 0.3);
  color: var(--text);
  font-size: 16px;
}
.row { display: flex; gap: 10px; }
.row button { flex: 1; }
.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; }
.small { font-size: 13px; opacity: 0.6; line-height: 1.4; }
.link { color: var(--accent2); }

@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.7); }
  100% { box-shadow: 0 0 0 16px rgba(255, 77, 109, 0); }
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="app">
  <header>
    <div class="brand"><span class="logo">M</span> MaBn AI</div>
    <div class="actions">
      <button id="ttsBtn" title="Jawab bolkar sunao">🔈</button>
      <button id="clearBtn" title="Chat saaf karo">🗑️</button>
      <button id="settingsBtn" title="Settings">⚙️</button>
    </div>
  </header>

  <main id="chat">
    <div class="welcome" id="welcome">
      <h1>Namaste! Main MaBn AI hoon</h1>
      <p>Kuch bhi poocho, likh ke ya mic dabake bol ke.</p>
    </div>
  </main>

  <form id="inputForm" class="inputbar" autocomplete="off">
    <button type="button" id="micBtn" class="round mic" title="Bol ke poochho">🎤</button>
    <input id="input" placeholder="Yahan likho..." />
    <button type="submit" class="round send" title="Bhejo">➤</button>
  </form>
</div>

<div id="settings" class="modal hidden">
  <div class="card">
    <h3>Gemini API Key</h3>
    <p class="small">
      Key <a class="link" href="https://aistudio.google.com/apikey" target="_blank">yahan se</a> free mein banao aur neeche paste karo.
      Key sirf is phone ke browser mein save hogi.
    </p>
    <input id="apiKey" type="password" placeholder="AIza..." />
    <div class="row">
      <button id="saveKey" class="primary">Save</button>
      <button id="closeSettings">Band karo</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

const MODEL = "gemini-2.5-flash";
let chat = JSON.parse(localStorage.getItem("mabn_chat") || "[]");
let apiKey = localStorage.getItem("mabn_key") || "";
let ttsOn = localStorage.getItem("mabn_tts") === "1";
let busy = false;

/* ---------- Live animated background ---------- */
(function background() {
  const canvas = $("bg");
  const ctx = canvas.getContext("2d");
  let w, h, dots;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    const count = Math.min(90, Math.floor((w * h) / 16000));
    dots = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r: Math.random() * 2 + 1,
    }));
  }

  function draw() {
    const g = ctx.createLinearGradient(0, 0, w, h);
    const t = Date.now() / 8000;
    g.addColorStop(0, `hsl(${250 + Math.sin(t) * 30}, 60%, 10%)`);
    g.addColorStop(1, `hsl(${200 + Math.cos(t) * 30}, 70%, 12%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    for (const d of dots) {
      d.x += d.vx;
      d.y += d.vy;
      if (d.x < 0 || d.x > w) d.vx *= -1;
      if (d.y < 0 || d.y > h) d.vy *= -1;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(124, 200, 255, 0.7)";
      ctx.fill();
    }
    for (let i = 0; i < dots.length; i++) {
      for (let j = i + 1; j < dots.length; j++) {
        const dx = dots[i].x - dots[j].x;
        const dy = dots[i].y - dots[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.strokeStyle = `rgba(124, 92, 255, ${0.25 * (1 - dist / 120)})`;
          ctx.beginPath();
          ctx.moveTo(dots[i].x, dots[i].y);
          ctx.lineTo(dots[j].x, dots[j].y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener("resize", resize);
  resize();
  draw();
})();

/* ---------- Chat UI ---------- */
function escapeHTML(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function format(text) {
  return escapeHTML(text)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\n/g, "<br>");
}

function addMessage(role, text, extraClass = "") {
  $("welcome")?.remove();
  const div = document.createElement("div");
  div.className = `msg ${role} ${extraClass}`;
  div.innerHTML = role === "bot" ? format(text) : escapeHTML(text);
  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "msg bot typing";
  div.id = "typing";
  div.innerHTML = "<span></span><span></span><span></span>";
  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
}

function hideTyping() {
  $("typing")?.remove();
}

function renderHistory() {
  if (chat.length === 0) return;
  $("welcome")?.remove();
  for (const m of chat) {
    addMessage(m.role === "user" ? "user" : "bot", m.parts[0].text);
  }
}

function saveChat() {
  localStorage.setItem("mabn_chat", JSON.stringify(chat.slice(-40)));
}

/* ---------- Voice output ---------- */
function speak(text) {
  if (!ttsOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const clean = text.replace(/[*`#]/g, "");
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "hi-IN";
  u.rate = 1;
  speechSynthesis.speak(u);
}

function updateTtsButton() {
  $("ttsBtn").textContent = ttsOn ? "🔊" : "🔈";
  $("ttsBtn").style.opacity = ttsOn ? "1" : "0.5";
}

$("ttsBtn").onclick = () => {
  ttsOn = !ttsOn;
  localStorage.setItem("mabn_tts", ttsOn ? "1" : "0");
  if (!ttsOn && "speechSynthesis" in window) speechSynthesis.cancel();
  updateTtsButton();
};

/* ---------- Voice input ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = $("micBtn");

if (SR) {
  const recognition = new SR();
  recognition.lang = "hi-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => micBtn.classList.add("listening");
  recognition.onend = () => micBtn.classList.remove("listening");
  recognition.onerror = () => micBtn.classList.remove("listening");
  recognition.onresult = (e) => {
    const said = e.results[0][0].transcript;
    sendMessage(said);
  };

  micBtn.onclick = () => {
    if (micBtn.classList.contains("listening")) {
      recognition.stop();
    } else {
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      recognition.start();
    }
  };
} else {
  micBtn.style.display = "none";
}

/* ---------- Gemini API ---------- */
async function askGemini() {
  const recent = chat.slice(-20);
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemInstruction: {
          parts: [{
            text: "Tum MaBn AI ho, ek dost jaise helpful assistant. User jis language mein likhe (Hindi, English ya Hinglish) usi mein jawab do. Jawab saaf aur seedha ho.",
          }],
        },
        contents: recent,
      }),
    }
  );

  const data = await res.json();
  if (!res.ok) {
    throw new Error(data?.error?.message || `HTTP ${res.status}`);
  }
  const text = data?.candidates?.[0]?.content?.parts?.map((p) => p.text).join("");
  if (!text) throw new Error("Khaali jawab aaya. Dobara poochho.");
  return text;
}

async function sendMessage(text) {
  text = text.trim();
  if (!text || busy) return;

  if (!apiKey) {
    openSettings();
    return;
  }

  busy = true;
  addMessage("user", text);
  chat.push({ role: "user", parts: [{ text }] });
  showTyping();

  try {
    const reply = await askGemini();
    hideTyping();
    addMessage("bot", reply);
    chat.push({ role: "model", parts: [{ text: reply }] });
    saveChat();
    speak(reply);
  } catch (err) {
    hideTyping();
    addMessage("bot", `Error: ${err.message}`, "error");
    chat.pop();
  } finally {
    busy = false;
  }
}

/* ---------- Form, settings, clear ---------- */
$("inputForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value;
  $("input").value = "";
  sendMessage(text);
});

function openSettings() {
  $("apiKey").value = apiKey;
  $("settings").classList.remove("hidden");
}

$("settingsBtn").onclick = openSettings;
$("closeSettings").onclick = () => $("settings").classList.add("hidden");
$("saveKey").onclick = () => {
  apiKey = $("apiKey").value.trim();
  localStorage.setItem("mabn_key", apiKey);
  $("settings").classList.add("hidden");
};

$("clearBtn").onclick = () => {
  if (!confirm("Saari chat delete karni hai?")) return;
  chat = [];
  saveChat();
  $("chat").innerHTML = `
    <div class="welcome" id="welcome">
      <h1>Namaste! Main MaBn AI hoon</h1>
      <p>Kuch bhi poocho, likh ke ya mic dabake bol ke.</p>
    </div>`;
};

/* ---------- Init ---------- */
updateTtsButton();
renderHistory();
if (!apiKey) openSettings();
</script>
</body>
</html>
